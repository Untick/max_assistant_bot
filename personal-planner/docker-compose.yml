# Docker Compose для микросервисной архитектуры Personal Planner

version: '3.8'

services:
  # PostgreSQL - основное хранилище данных
  postgres:
    image: postgres:15-alpine
    container_name: planner_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - planner_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - кэш и FSM-память
  redis:
    image: redis:7-alpine
    container_name: planner_redis
    ports:
      - "6379:6379"
    networks:
      - planner_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telegram Gateway (Aiogram 3.x)
  tg_gateway:
    build:
      context: .
      dockerfile: services/tg_gateway/Dockerfile
    container_name: planner_tg_gateway
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_planner
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_BASE_URL=${LLM_API_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TIMEZONE=Europe/Moscow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/tg_gateway:/app
      - ./shared:/shared
    networks:
      - planner_network
    restart: unless-stopped

  # ASR Service (Whisper)
  asr_service:
    build:
      context: .
      dockerfile: services/asr/Dockerfile
    container_name: planner_asr
    environment:
      - ASR_MODEL_SIZE=${ASR_MODEL_SIZE:-base}
      - ASR_LANGUAGE=ru
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/asr:/app
      - whisper_cache:/root/.cache/whisper
    networks:
      - planner_network
    restart: unless-stopped
    # Whisper требует GPU для быстрой работы, раскомментируйте при наличии:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Agent Core (LangChain/LangGraph)
  agent_core:
    build:
      context: .
      dockerfile: services/agent_core/Dockerfile
    container_name: planner_agent_core
    environment:
      - LLM_API_BASE_URL=${LLM_API_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen-2.5-7b-instruct}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_planner
      - REDIS_URL=redis://redis:6379/0
      - RAG_SERVICE_URL=http://rag_service:8002
      - MCP_SERVER_URL=http://mcp_server:8003
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TIMEZONE=Europe/Moscow
    depends_on:
      - redis
      - postgres
    volumes:
      - ./services/agent_core:/app
      - ./shared:/shared
    networks:
      - planner_network
    restart: unless-stopped

  # MCP Server (FastMCP)
  mcp_server:
    build:
      context: .
      dockerfile: services/mcp_server/Dockerfile
    container_name: planner_mcp_server
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_planner
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TIMEZONE=Europe/Moscow
    depends_on:
      - postgres
    volumes:
      - ./services/mcp_server:/app
      - ./shared:/shared
      - mcp_credentials:/app/credentials
    networks:
      - planner_network
    restart: unless-stopped

  # RAG Service (FAISS + SQLite FTS5)
  rag_service:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: planner_rag
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_planner
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-500}
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.75}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
    volumes:
      - ./services/rag:/app
      - ./shared:/shared
      - rag_index:/app/index
    networks:
      - planner_network
    restart: unless-stopped

  # Scheduler Service (APScheduler)
  scheduler_service:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: planner_scheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_planner
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-Europe/Moscow}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
      - tg_gateway
    volumes:
      - ./services/scheduler:/app
      - ./shared:/shared
    networks:
      - planner_network
    restart: unless-stopped

networks:
  planner_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
  mcp_credentials:
  rag_index:
